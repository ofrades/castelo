# Kamal 2.x — Castelo
# Usage:
#   kamal setup    # first time — prepares the host and kamal-proxy
#   kamal deploy   # build image, push, restart container
#   kamal logs     # tail logs
#   kamal console  # open a node repl in the app container

service: castelo
image: ofrades/castelo

servers:
  web:
    hosts:
      - mohshoo
    options:
      volume:
        - /var/lib/castelo/data:/app/data

registry:
  server: ghcr.io
  username:
    - KAMAL_REGISTRY_USERNAME
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64

proxy:
  host: castelo.mohshoo.com
  app_port: 3000
  response_timeout: 300
  buffering:
    responses: false
  healthcheck:
    path: /api/health

env:
  clear:
    PORT: 3000
    NODE_ENV: production
    BETTER_AUTH_URL: https://castelo.mohshoo.com
    DB_PATH: /app/data/castelo.sqlite
    DATA_DIR: /app/data
    OPENROUTER_HTTP_REFERER: https://castelo.mohshoo.com
    OPENROUTER_APP_TITLE: Castelo
    BILLING_MARKUP_MULTIPLIER: 1.8
  secret:
    - AUTH_SECRET
    - GOOGLE_CLIENT_ID
    - GOOGLE_CLIENT_SECRET
    - OPENROUTER_API_KEY
    - AI_MODEL
    - STRIPE_SECRET_KEY
    - STRIPE_WEBHOOK_SECRET
# Route castelo.mohshoo.com to http://127.0.0.1:80 on the VPS.
# kamal-proxy is published on host port 80.
